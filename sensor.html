<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; background: #0f0d16; color: #ddd; font: 600 10px system-ui, sans-serif; overflow: hidden; }
    .wrap { position: relative; width: 120px; height: 90px; }
    video { width: 120px; height: 90px; object-fit: cover; transform: scaleX(-1); display: block; border-radius: 10px; }
    canvas { position: absolute; inset: 0; width: 120px; height: 90px; pointer-events: none; }
    body.voice canvas { display: none; }
    .tag { position: absolute; left: 4px; bottom: 4px; right: 4px; padding: 2px 5px; border-radius: 6px;
      background: rgba(0,0,0,.65); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mic { display: none; width: 120px; height: 90px; border-radius: 10px; background: #1c1a26;
      align-items: center; justify-content: center; flex-direction: column; gap: 6px; }
    .dot { width: 22px; height: 22px; border-radius: 50%; background: #dc2626; box-shadow: 0 0 0 0 rgba(220,38,38,.6); }
    .listening .dot { animation: pulse 1.4s infinite; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 12px rgba(220,38,38,0); } 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); } }
    .gear { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 6px;
      background: rgba(0,0,0,.65); color: #fff; font-size: 13px; line-height: 22px; cursor: pointer; }
    body.voice video { display: none; }
    body.voice .mic { display: flex; }
  </style>
</head>
<body>
  <div class="wrap">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="boxes"></canvas>
    <div class="mic" id="mic"><div class="dot"></div><div>Voice</div></div>
    <div class="tag" id="tag">Starting…</div>
    <button class="gear" id="gear" title="Choose camera / microphone">⚙</button>
  </div>
  <script type="module" src="sensor.js"></script>
</body>
</html>
