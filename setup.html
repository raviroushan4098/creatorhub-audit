<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Audit Assistant Setup</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #17151f; color: #eee; font: 15px system-ui, sans-serif; }
    .card { width: min(520px, calc(100vw - 32px)); background: #221f2e; border: 1px solid #3a3550; border-radius: 18px; padding: 28px; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { color: #bbb; line-height: 1.5; }
    button { font: 700 15px system-ui; color: #fff; background: #7c3aed; border: 0; border-radius: 12px; padding: 12px 20px; cursor: pointer; }
    button.done { background: #16a34a; }
    .ok { color: #4ade80; font-weight: 700; }
    .err { color: #f87171; font-weight: 700; }
    #cams { display: none; margin-top: 16px; }
    #cams.show { display: block; }
    select { width: 100%; font: 15px system-ui; padding: 10px; border-radius: 10px; background: #17151f; color: #eee; border: 1px solid #3a3550; }
    video { width: 100%; aspect-ratio: 4 / 3; margin: 12px 0; background: #000; border-radius: 12px; object-fit: cover; transform: scaleX(-1); }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Allow access</h1>
    <p id="why"></p>
    <button id="grant">Allow</button>
    <p id="result"></p>
    <div id="cams">
      <label for="camera">Camera to use</label>
      <select id="camera"></select>
      <video id="preview" autoplay muted playsinline></video>
      <button class="done" id="done">Use this camera</button>
    </div>
  </div>
  <script src="setup.js"></script>
</body>
</html>
